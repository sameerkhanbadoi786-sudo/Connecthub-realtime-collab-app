<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ConnectHub — Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="room-body">

  <header class="room-header">
    <div class="room-info">
      <span>Room</span>
      <span class="room-code" id="room-id-display"></span>
      <button id="copy-room-btn" type="button">Copy link</button>
    </div>

    <button id="room-menu-btn" class="hamburger-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="room-user-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <div class="room-user" id="room-user-menu">
      <span class="avatar-dot" id="avatar-initial"></span>
      <span id="username-display"></span>
      <button id="room-menu-leave-btn" class="danger" type="button">Leave room</button>
    </div>
  </header>

  <main class="room-main">
    <section class="video-panel">
      <div id="video-grid" class="video-grid"></div>

      <nav class="dock" aria-label="Call controls">
        <button id="toggle-mic" class="dock-btn is-active" type="button" aria-label="Mute microphone" title="Mute microphone">
          <span class="icon-on-only">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/></svg>
          </span>
          <span class="icon-off-only">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
          </span>
        </button>

        <button id="toggle-cam" class="dock-btn is-active" type="button" aria-label="Turn off camera" title="Turn off camera">
          <span class="icon-on-only">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="12" rx="2.5"/><path d="M15 10.2 21 7v10l-6-3.2z"/></svg>
          </span>
          <span class="icon-off-only">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="12" rx="2.5"/><path d="M15 10.2 21 7v10l-6-3.2z"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </span>
        </button>

        <span class="dock-divider"></span>

        <button id="toggle-screen" class="dock-btn" type="button" aria-label="Share screen" title="Share screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/><path d="M9 12l3-3 3 3"/><line x1="12" y1="9" x2="12" y2="14"/></svg>
        </button>

        <button id="toggle-whiteboard" class="dock-btn" type="button" aria-label="Open whiteboard" title="Whiteboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20l1.5-4.5L18 14l-4.5 1.5L12 20z"/><path d="M14 12l6.5-6.5a1.5 1.5 0 0 0-2-2L12 10l2 2z"/><path d="M4 20h4"/></svg>
        </button>

        <button id="toggle-files" class="dock-btn" type="button" aria-label="Open files" title="Files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5V17a2 2 0 0 1-2 2H8a3 3 0 0 1-3-3V7a2 2 0 0 1 2-2h3.5l2 2H19a2 2 0 0 1 2 2v1.5"/><path d="M12 15v-5m0 0-2 2m2-2 2 2"/></svg>
        </button>

        <span class="dock-divider"></span>

        <button id="leave-btn" class="dock-btn leave-btn" type="button" aria-label="Leave call" title="Leave call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5c0-3 3.5-5.5 7.5-5.5s7.5 2.5 7.5 5.5c0 1-.7 1.7-1.6 2l-2.3.8a1.6 1.6 0 0 1-1.9-.7l-.5-.9a5.6 5.6 0 0 0-2.4 0l-.5.9a1.6 1.6 0 0 1-1.9.7l-2.3-.8c-.9-.3-1.6-1-1.6-2z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
        </button>
      </nav>
    </section>

    <aside id="side-panel" class="side-panel hidden">
      <div class="side-tabs">
        <button id="side-tab-whiteboard" class="side-tab active" type="button">Whiteboard</button>
        <button id="side-tab-files" class="side-tab" type="button">Files</button>
        <button id="side-tab-chat" class="side-tab" type="button">Chat</button>
        <button id="close-side-panel" class="side-panel-close" type="button" aria-label="Close panel" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>

      <div id="whiteboard-panel" class="side-content">
        <div class="wb-toolbar">
          <input type="color" id="wb-color" value="#1b1e26" title="Stroke color" />
          <input type="range" id="wb-size" min="1" max="20" value="3" title="Stroke width" />
          <button id="wb-clear" class="secondary" type="button">Clear board</button>
        </div>
        <canvas id="whiteboard" width="640" height="420"></canvas>
      </div>

      <div id="files-panel" class="side-content hidden">
        <div class="file-drop">
          <p style="margin:0 0 10px">Share a file with everyone in this room</p>
          <input type="file" id="file-input" />
        </div>
        <ul id="file-list"></ul>
      </div>

      <div id="chat-panel" class="side-content hidden">
        <ul id="chat-list"></ul>
        <form id="chat-form" autocomplete="off">
          <div id="mention-dropdown" class="popover hidden"></div>
          <div id="emoji-picker" class="popover emoji-picker hidden"></div>
          <div class="chat-input-row">
           <button type="button" id="emoji-btn" class="emoji-btn" title="Insert emoji" aria-label="Insert emoji">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"></circle>
    <line x1="9" y1="10" x2="9" y2="10.5"></line>
    <line x1="15" y1="10" x2="15" y2="10.5"></line>
    <path d="M8 14c1.2 1.5 2.6 2.2 4 2.2s2.8-0.7 4-2.2"></path>
  </svg>
</button>
            <input type="text" id="chat-input" placeholder="Message the room · @ to mention" autocomplete="off" />
            <button type="submit">Send</button>
          </div>
        </form>
      </div>
    </aside>
  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="/js/room.js"></script>
<script src="/js/whiteboard.js"></script>
</body>
</html>
